[project]
name = "prosta-ai"
version = "0.3.0"
description = "Prosta-AI: segmentación 3D experimental de próstata en MRI (uso académico, no diagnóstico)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4",
  "nibabel==5.3.2",
  "SimpleITK==2.4.0",
  "monai==1.4.0",
  "torch==2.5.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["prosta_ai*"]
